<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1000" height="720" viewBox="0 0 1000 720"
     role="img" aria-labelledby="lcrvTitle lcrvDesc">

  <title id="lcrvTitle">LC-RV wiring diagram</title>
  <desc id="lcrvDesc">Schematic of the Low-Cost Rotational Viscometer electronics: Arduino
  Nano, A4988 stepper driver with a 100 microfarad VMOT capacitor and a separate 12 volt
  supply, NEMA 17 stepper, HX711 with a four-wire load-cell bridge, SSD1306 OLED on I2C,
  LM393 slotted opto tachometer and a 10 kilohm potentiometer, all sharing one common
  ground.</desc>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="719" fill="none" stroke="#c9d1d9" stroke-width="1"/>

  <!-- ============================== title =============================== -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933" text-anchor="middle">
    <text x="500" y="34" font-size="22" font-weight="bold">LC-RV — wiring diagram</text>
    <text x="500" y="54" font-size="12">Arduino Nano (ATmega328P, 5 V logic) · every net labelled with its Arduino pin</text>
  </g>

  <!-- ============================== legend ============================== -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933" font-size="11">
    <line x1="60" y1="76" x2="92" y2="76" stroke="#1f2933" stroke-width="1.8"/>
    <text x="100" y="80">signal, 5 V logic</text>
    <line x1="230" y1="76" x2="262" y2="76" stroke="#cc7a00" stroke-width="2.4"/>
    <text x="270" y="80">+5 V</text>
    <line x1="330" y1="76" x2="362" y2="76" stroke="#c02026" stroke-width="3"/>
    <text x="370" y="80">+12 V motor rail</text>
    <line x1="510" y1="76" x2="542" y2="76" stroke="#111111" stroke-width="3.6"/>
    <circle cx="526" cy="76" r="3.2" fill="#111111"/>
    <text x="550" y="80">ground · filled dot = joint, plain crossing = no joint</text>
  </g>

  <!-- ========================= ground bus + rails ======================= -->
  <line x1="40" y1="670" x2="960" y2="670" stroke="#111111" stroke-width="4.5"/>
  <text x="500" y="694" font-family="Arial, Helvetica, sans-serif" font-size="12"
        fill="#111111" text-anchor="middle">Common ground: the 12 V supply return and the Arduino ground are one node.</text>
  <line x1="40" y1="150" x2="40" y2="670" stroke="#111111" stroke-width="2.6"/>
  <line x1="960" y1="110" x2="960" y2="670" stroke="#111111" stroke-width="2.6"/>
  <circle cx="40" cy="670" r="4" fill="#111111"/>
  <circle cx="960" cy="670" r="4" fill="#111111"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111" font-size="10" text-anchor="middle">
    <text x="40" y="143">GND</text>
    <text x="960" y="103">GND</text>
  </g>

  <!-- ========================== Arduino Nano ============================ -->
  <rect x="400" y="150" width="200" height="470" rx="6" fill="#e8eef7" stroke="#1f2933" stroke-width="2.2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933" text-anchor="middle">
    <text x="500" y="180" font-size="16" font-weight="bold">ARDUINO NANO</text>
    <text x="500" y="199" font-size="11">ATmega328P · 16 MHz · 5 V</text>
    <text x="500" y="370" font-size="11" font-weight="bold">USB to host PC</text>
    <text x="500" y="387" font-size="11">115200 baud, CSV out</text>
  </g>
  <line x1="500" y1="620" x2="500" y2="670" stroke="#111111" stroke-width="2.6"/>
  <text x="508" y="648" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#111111">GND</text>

  <!-- 5 V taps and distribution rails -->
  <g stroke="#cc7a00" stroke-width="2.4" fill="none">
    <line x1="400" y1="300" x2="356" y2="300"/>
    <line x1="356" y1="175" x2="356" y2="545"/>
    <line x1="356" y1="175" x2="340" y2="175"/>
    <line x1="356" y1="425" x2="340" y2="425"/>
    <line x1="356" y1="545" x2="340" y2="545"/>
    <line x1="600" y1="320" x2="644" y2="320"/>
    <line x1="644" y1="228" x2="644" y2="520"/>
    <line x1="644" y1="228" x2="660" y2="228"/>
    <line x1="644" y1="520" x2="660" y2="520"/>
  </g>
  <g fill="#cc7a00">
    <circle cx="356" cy="300" r="3.2"/>
    <circle cx="356" cy="425" r="3.2"/>
    <circle cx="644" cy="320" r="3.2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#cc7a00" font-size="11" font-weight="bold">
    <text x="406" y="295">5V</text>
    <text x="594" y="315" text-anchor="end">5V</text>
  </g>

  <!-- ==================================================================== -->
  <!-- ============================ LEFT COLUMN =========================== -->
  <!-- ==================================================================== -->

  <!--  HX711  -->
  <rect x="60" y="150" width="280" height="85" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="72" y="174" font-size="15" font-weight="bold">HX711</text>
    <text x="72" y="192" font-size="11">24-bit bridge amplifier, 10 samples/s</text>
    <text x="334" y="172" font-size="10.5" text-anchor="end" fill="#cc7a00">VCC</text>
    <text x="334" y="194" font-size="10.5" text-anchor="end">DT</text>
    <text x="334" y="219" font-size="10.5" text-anchor="end">SCK</text>
    <text x="66" y="228" font-size="10.5">GND</text>
  </g>

  <!--  load cell bridge  -->
  <rect x="60" y="265" width="280" height="125" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="72" y="288" font-size="15" font-weight="bold">LOAD CELL — 100 g</text>
    <text x="72" y="305" font-size="11">straight-bar strain gauge</text>
    <text x="72" y="384" font-size="10.5" font-style="italic">Full bridge; excited by the HX711, no separate ground.</text>
  </g>
  <g stroke="#1f2933" stroke-width="1.6" fill="none">
    <path d="M 200 315 L 240 345 L 200 375 L 160 345 Z"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933" font-size="10" text-anchor="middle">
    <text x="221" y="326">R</text>
    <text x="221" y="371">R</text>
    <text x="181" y="326">R</text>
    <text x="181" y="371">R</text>
  </g>
  <g stroke="#1f2933" stroke-width="1.7" fill="none">
    <path d="M 200 315 L 200 300 L 105 300 L 105 235"/>
    <path d="M 160 345 L 130 345 L 130 308 L 165 308 L 165 235"/>
    <path d="M 240 345 L 270 345 L 270 308 L 225 308 L 225 235"/>
    <path d="M 200 375 L 300 375 L 300 296 L 285 296 L 285 235"/>
  </g>
  <g font-family="monospace, monospace" fill="#1f2933" font-size="11" font-weight="bold">
    <text x="110" y="252">E+</text>
    <text x="170" y="252">A-</text>
    <text x="230" y="252">A+</text>
    <text x="290" y="252">E-</text>
  </g>

  <!--  SSD1306  -->
  <rect x="60" y="415" width="280" height="80" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="72" y="438" font-size="15" font-weight="bold">SSD1306 OLED</text>
    <text x="72" y="456" font-size="11">128 x 64, I2C address 0x3C</text>
    <text x="72" y="472" font-size="11">shows speed, stress and viscosity</text>
    <text x="334" y="422" font-size="10.5" text-anchor="end" fill="#cc7a00">VCC</text>
    <text x="334" y="446" font-size="10.5" text-anchor="end">SDA</text>
    <text x="334" y="470" font-size="10.5" text-anchor="end">SCL</text>
    <text x="66" y="488" font-size="10.5">GND</text>
  </g>

  <!--  potentiometer  -->
  <rect x="60" y="520" width="230" height="80" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="72" y="543" font-size="15" font-weight="bold">POTENTIOMETER 10 k</text>
    <text x="72" y="561" font-size="11">sets the bob speed</text>
    <text x="72" y="578" font-size="10.5" fill="#5a6672">top end to 5 V, bottom end to ground,</text>
    <text x="72" y="592" font-size="10.5" fill="#5a6672">wiper to A0</text>
  </g>
  <!-- pot symbol -->
  <g stroke="#1f2933" stroke-width="1.7" fill="none">
    <rect x="292" y="530" width="16" height="50"/>
    <line x1="300" y1="530" x2="300" y2="545"/>
    <line x1="300" y1="545" x2="340" y2="545"/>
    <line x1="308" y1="555" x2="340" y2="555"/>
    <line x1="300" y1="580" x2="300" y2="612"/>
  </g>
  <path d="M 308 555 L 322 549 L 316 555 L 322 561 Z" fill="#1f2933" stroke="none"/>

  <!-- left signal wiring -->
  <g stroke="#1f2933" stroke-width="1.8" fill="none">
    <line x1="340" y1="190" x2="400" y2="190"/>
    <line x1="340" y1="215" x2="400" y2="215"/>
    <line x1="340" y1="442" x2="400" y2="442"/>
    <line x1="340" y1="466" x2="400" y2="466"/>
    <line x1="340" y1="555" x2="400" y2="555"/>
  </g>
  <g font-family="monospace, monospace" fill="#0b5394" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="378" y="186">D3</text>
    <text x="378" y="211">D4</text>
    <text x="378" y="438">A4</text>
    <text x="378" y="462">A5</text>
    <text x="378" y="551">A0</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#5a6672" font-size="8.5" text-anchor="middle">
    <text x="378" y="201">bridge data</text>
    <text x="378" y="226">bridge clock</text>
    <text x="378" y="453">I2C data</text>
    <text x="378" y="477">I2C clock</text>
    <text x="378" y="566">speed knob</text>
  </g>

  <!-- left ground returns -->
  <g stroke="#111111" stroke-width="2.2" fill="none">
    <line x1="60" y1="228" x2="40" y2="228"/>
    <line x1="60" y1="488" x2="40" y2="488"/>
    <line x1="300" y1="612" x2="40" y2="612"/>
  </g>
  <g fill="#111111">
    <circle cx="40" cy="228" r="3.4"/>
    <circle cx="40" cy="488" r="3.4"/>
    <circle cx="40" cy="612" r="3.4"/>
  </g>

  <!-- ==================================================================== -->
  <!-- =========================== RIGHT COLUMN =========================== -->
  <!-- ==================================================================== -->

  <rect x="650" y="92" width="300" height="360" rx="8" fill="#fdf4f4" stroke="#c02026"
        stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="800" y="106" font-family="Arial, Helvetica, sans-serif" font-size="11"
        font-weight="bold" fill="#c02026" text-anchor="middle">12 V POWER DOMAIN</text>

  <!--  12 V supply  -->
  <rect x="660" y="112" width="280" height="52" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="672" y="133" font-size="14.5" font-weight="bold">12 V DC, 2 A SUPPLY</text>
    <text x="672" y="152" font-size="11">barrel jack, centre positive</text>
    <text x="856" y="158" font-size="10" text-anchor="middle" fill="#c02026" font-weight="bold">+12 V</text>
    <text x="916" y="158" font-size="10" text-anchor="middle" font-weight="bold">GND</text>
  </g>

  <!--  12 V rail + 100 uF VMOT cap  -->
  <line x1="856" y1="164" x2="856" y2="205" stroke="#c02026" stroke-width="3"/>
  <line x1="916" y1="164" x2="916" y2="205" stroke="#111111" stroke-width="2.6"/>
  <g stroke="#1f2933" stroke-width="1.7" fill="none">
    <line x1="856" y1="185" x2="879" y2="185"/>
    <line x1="893" y1="185" x2="916" y2="185"/>
  </g>
  <line x1="879" y1="174" x2="879" y2="196" stroke="#1f2933" stroke-width="2.4"/>
  <line x1="893" y1="174" x2="893" y2="196" stroke="#1f2933" stroke-width="2.4"/>
  <circle cx="856" cy="185" r="3.4" fill="#c02026"/>
  <circle cx="916" cy="185" r="3.4" fill="#111111"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="873" y="171" font-size="11" font-weight="bold" text-anchor="middle">+</text>
    <text x="848" y="182" font-size="10.5" text-anchor="end">100 µF across VMOT</text>
    <text x="848" y="196" font-size="10.5" text-anchor="end">+ lead to the 12 V side</text>
  </g>

  <!--  A4988  -->
  <rect x="660" y="205" width="280" height="135" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="856" y="218" font-size="9.5" text-anchor="middle" fill="#c02026" font-weight="bold">VMOT</text>
    <text x="916" y="218" font-size="9.5" text-anchor="middle" font-weight="bold">GND</text>
    <text x="740" y="240" font-size="14.5" font-weight="bold">A4988 DRIVER</text>
    <text x="740" y="262" font-size="10.5">MS1 = MS2 = MS3 to 5 V:</text>
    <text x="740" y="276" font-size="10.5">1/16 microstepping,</text>
    <text x="740" y="290" font-size="10.5">3200 steps per revolution</text>
    <text x="740" y="312" font-size="10.5">Set the current limit from</text>
    <text x="740" y="326" font-size="10.5">I = Vref / (8 x Rsense)</text>
    <text x="666" y="232" font-size="10.5" fill="#cc7a00">VDD 5 V</text>
    <text x="666" y="255" font-size="10.5">DIR</text>
    <text x="666" y="285" font-size="10.5">STEP</text>
    <text x="934" y="334" font-size="9.5" text-anchor="end">GND</text>
  </g>

  <!--  motor phase leads  -->
  <g stroke="#c02026" stroke-width="2.4" fill="none">
    <line x1="710" y1="340" x2="710" y2="380"/>
    <line x1="770" y1="340" x2="770" y2="380"/>
    <line x1="830" y1="340" x2="830" y2="380"/>
    <line x1="890" y1="340" x2="890" y2="380"/>
  </g>
  <g font-family="monospace, monospace" fill="#1f2933" font-size="10">
    <text x="716" y="364">1A</text>
    <text x="776" y="364">1B</text>
    <text x="836" y="364">2A</text>
    <text x="896" y="364">2B</text>
  </g>

  <!--  NEMA 17  -->
  <rect x="660" y="380" width="280" height="62" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="672" y="402" font-size="15" font-weight="bold">NEMA 17 STEPPER</text>
    <text x="672" y="419" font-size="11">bipolar, 5 mm shaft with a flat</text>
    <text x="672" y="434" font-size="10.5" fill="#5a6672">Four leads only — the motor has no ground connection.</text>
  </g>

  <!--  LM393 slotted opto  -->
  <rect x="660" y="480" width="280" height="76" rx="5" fill="#f4f6f9" stroke="#1f2933" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2933">
    <text x="722" y="503" font-size="15" font-weight="bold">LM393 SLOTTED OPTO</text>
    <text x="722" y="521" font-size="11">reads the 20-slot encoder disc</text>
    <text x="722" y="537" font-size="10.5" fill="#5a6672">One rising edge per slot.</text>
    <text x="666" y="499" font-size="10.5">OUT</text>
    <text x="666" y="524" font-size="10.5" fill="#cc7a00">VCC</text>
    <text x="934" y="550" font-size="9.5" text-anchor="end">GND</text>
  </g>

  <!-- right signal wiring -->
  <g stroke="#1f2933" stroke-width="1.8" fill="none">
    <line x1="600" y1="250" x2="660" y2="250"/>
    <line x1="600" y1="280" x2="660" y2="280"/>
    <line x1="600" y1="495" x2="660" y2="495"/>
  </g>
  <g font-family="monospace, monospace" fill="#0b5394" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="622" y="246">D8</text>
    <text x="622" y="276">D9</text>
    <text x="622" y="491">D2</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#5a6672" font-size="8.5" text-anchor="middle">
    <text x="622" y="261">direction</text>
    <text x="622" y="291">step, Timer1 OC1A</text>
    <text x="622" y="506">tacho</text>
  </g>

  <!-- right ground returns -->
  <g stroke="#111111" stroke-width="2.2" fill="none">
    <line x1="940" y1="150" x2="960" y2="150"/>
    <line x1="940" y1="330" x2="960" y2="330"/>
    <line x1="940" y1="546" x2="960" y2="546"/>
  </g>
  <g fill="#111111">
    <circle cx="960" cy="150" r="3.4"/>
    <circle cx="960" cy="330" r="3.4"/>
    <circle cx="960" cy="546" r="3.4"/>
  </g>

</svg>
